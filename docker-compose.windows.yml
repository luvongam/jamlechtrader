version: '3.8'

services:
  # Windows Server with MT5
  mt5-server:
    build:
      context: .
      dockerfile: Dockerfile
    platform: windows/amd64
    container_name: jamlechtrader-mt5
    environment:
      - MT5_LOGIN=${MT5_LOGIN}
      - MT5_PASSWORD=${MT5_PASSWORD}
      - MT5_SERVER=${MT5_SERVER}
      - DEFAULT_SYMBOL=${DEFAULT_SYMBOL:-EURUSD}
      - DEFAULT_TIMEFRAME=${DEFAULT_TIMEFRAME:-H1}
    volumes:
      - ./data_cache:C:\\app\\data_cache
      - ./logs:C:\\app\\logs
      - ./output:C:\\app\\output
    restart: unless-stopped
    networks:
      - trading-network

  # Linux bot connecting to Windows MT5 via API
  trading-bot:
    build:
      context: .
      dockerfile: Dockerfiledwewe
    container_name: jamlechtrader-bot
    depends_on:
      - mt5-server
    environment:
      - MT5_HOST=mt5-server
      - MT5_PORT=8000
    volumes:
      - ./data_cache:/app/data_cache
      - ./logs:/app/logs
      - ./output:/app/output
    restart: unless-stopped
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jamlechtrader"
version = "0.1.0"
description = "Production-grade quantitative trading platform powered by MetaTrader 5"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "click>=8.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "pyarrow>=12.0",
    "requests>=2.31",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    # Phase 1: Database + Audit + Security
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "cryptography>=42.0",
    "keyring>=25.0",
    # Phase 2: Resilience
    "tenacity>=8.2",
    # Phase 3: Async
    "websockets>=12.0",
    # Phase 4: Enterprise Risk
    "scipy>=1.11",
    # Smart Money Concepts
    "smartmoneyconcepts>=0.0.21",
    # Phase 6: Monitoring
    "prometheus-client>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
mt5 = [
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
]
indicators = []
reports = [
    "quantstats>=0.0.62",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "pytest-timeout>=2.2",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "hypothesis>=6.90",
    "aiosqlite>=0.20",
    "factory-boy>=3.3",
    "respx>=0.21",
]

[project.scripts]
jamlechtrader = "jamlechtrader.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["jamlechtrader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "pytest-timeout>=2.2",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "hypothesis>=6.90",
    "aiosqlite>=0.20",
    "factory-boy>=3.3",
    "respx>=0.21",
]
